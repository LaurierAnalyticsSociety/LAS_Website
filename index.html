<!doctype html>
<html lang="en-CA" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Laurier Analytics Society (LAS) | Data &amp; Analytics Club at Wilfrid Laurier University</title>
    <meta
      name="description"
      content="The Laurier Analytics Society (LAS) is Wilfrid Laurier University's student-run data and analytics club in Waterloo, Ontario. Join workshops, industry mentorship, speaker nights and the annual LAS Datathon. Every program welcome." />
    <link rel="canonical" href="https://laurieranalytics.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Laurier Analytics Society" />
    <meta name="theme-color" content="#070b0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonts are @imported from Google Fonts in src/index.css; preconnect and
         preload so they start downloading before the stylesheet is parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:site_name" content="Laurier Analytics Society" />

    <meta property="og:url" content="https://laurieranalytics.com/" />
    <meta property="og:image" content="https://laurieranalytics.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Laurier Analytics Society members at The Data Minds Challenge datathon." />
    <meta property="og:locale" content="en_CA" />

    <meta name="twitter:title" content="Laurier Analytics Society (LAS) | Data &amp; Analytics Club at Wilfrid Laurier University" />
    <meta
      name="twitter:description"
      content="Wilfrid Laurier University's student-run data and analytics club. Workshops, industry mentorship and the annual LAS Datathon." />
    <meta name="twitter:image" content="https://laurieranalytics.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Laurier Analytics Society members at The Data Minds Challenge datathon." />
